                $ref: '#/components/schemas/Request'
        '409':
          description: Conflict - already inactive or operation in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /security/edgeproxy/v3/templates:
    get:
      tags:
      - v3
      - edge_proxy
      - proxy templates
      - public
      - edge_proxy_public
      - public
      summary: List proxy templates
      description: List proxy templates visible to the caller (own + common default). Sorted by id ascending.
      operationId: list_proxy_templates_api_edge_proxy_v3_templates_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000000000
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponse_Union_ProxyTemplateAdminResponse__ProxyTemplateUserResponse__'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
          description: Forbidden
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /security/edgeproxy/v3/templates/{template_id}:
    get:
      tags:
      - v3
      - edge_proxy
      - proxy templates
      - public
      - edge_proxy_public
      - public
      summary: Get proxy template
      description: Get a proxy template visible to the caller (own or common default).
      operationId: get_proxy_template_api_edge_proxy_v3_templates__template_id__get
      parameters:
      - name: template_id
        in: path
        required: true
        schema:
          type: integer
          maximum: 1000000000
          minimum: 1
          description: A positive integer ID
          title: Template Id
        description: A positive integer ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ProxyTemplateAdminResponse'
                - $ref: '#/components/schemas/ProxyTemplateUserResponse'
                title: Response Get Proxy Template Api Edge Proxy V3 Templates  Template Id  Get
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
          description: Forbidden
        '404':
          description: Proxy template not found
          content:
