openapi: 3.1.0
info:
  title: Gcore OpenAPI – Edge Proxy API
  description: This OpenAPI is an aggregated OpenAPI specification that unifies all Gcore products into a single file. It covers Cloud, CDN, DNS, WAAP, DDoS Protection, Object Storage, Streaming, and FastEdge services.
  version: fcde528c1488
servers:
- url: https://api.gcore.com
paths:
  /security/edgeproxy/v3/profiles:
    get:
      tags:
      - v3
      - edge_proxy
      - proxy profiles
      - public
      - edge_proxy_public
      summary: List proxy profiles
      description: List proxy profiles with optional filtering by client, status, and search (matches name, origin IP, or protected IP). Sorting by default is by 'created_at' field desc.
      operationId: list_proxy_profiles_api_edge_proxy_v3_profiles_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ProxyProfileStatus'
          - type: 'null'
          title: Status
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          description: Search by name, origin IP or protected IP
          title: Search
        description: Search by name, origin IP or protected IP
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000000000
          minimum: 0
          default: 0
          title: Offset
      - name: ordering
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          description: Ordering, e.g. 'created_at,name'
          title: Ordering
        description: Ordering, e.g. 'created_at,name'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponse_ProxyProfileClientResponse_'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
          description: Forbidden
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - v3
      - edge_proxy
      - proxy profiles
      - public
      - edge_proxy_public
      summary: Create proxy profile
      description: Create a new edge proxy profile with ACL rules. Omit `protected_ip_address` or use null for automatic allocation. For manual selection, supply an IPv4 string from any non-common pool assigned to the target customer, including restricted shared pools. Manual failures never substitute another address or pool.
      operationId: create_proxy_profile_api_edge_proxy_v3_profiles_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProxyProfileClientCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyProfileClientResponse'
        '400':
          description: Address conflicts with active protection configuration, or edge proxy service is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '403':
          description: Requested protected IP is not in your assigned pools.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '409':
          description: Requested protected IP is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /security/edgeproxy/v3/profiles/{proxy_profile_id}:
    get:
      tags:
      - v3
      - edge_proxy
      - proxy profiles
      - public
      - edge_proxy_public
      summary: Get proxy profile
