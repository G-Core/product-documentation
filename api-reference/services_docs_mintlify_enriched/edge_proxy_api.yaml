      parameters:
      - name: proxy_profile_id
        in: path
        required: true
        schema:
          type: integer
          title: Proxy Profile Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyProfileClientResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
          description: Forbidden
        '404':
          description: Proxy profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - v3
      - edge_proxy
      - proxy profiles
      - public
      - edge_proxy_public
      summary: Replace proxy profile
      description: Replace an existing edge proxy profile's name, origin, template and ACL rules.
      operationId: update_proxy_profile_api_edge_proxy_v3_profiles__proxy_profile_id__put
      parameters:
      - name: proxy_profile_id
        in: path
        required: true
        schema:
          type: integer
          title: Proxy Profile Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProxyProfileRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyProfileClientResponse'
        '400':
          description: Edge proxy service is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
          description: Forbidden
        '404':
          description: Proxy profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - v3
      - edge_proxy
      - proxy profiles
      - public
      - edge_proxy_public
      summary: Update proxy profile
      description: Update the given fields of an existing edge proxy profile; omitted fields are kept.
      operationId: patch_proxy_profile_api_edge_proxy_v3_profiles__proxy_profile_id__patch
      parameters:
      - name: proxy_profile_id
        in: path
        required: true
        schema:
          type: integer
          title: Proxy Profile Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchProxyProfileRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyProfileClientResponse'
        '400':
          description: Edge proxy service is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
          description: Forbidden
        '404':
          description: Proxy profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - v3
      - edge_proxy
      - proxy profiles
      - public
      - edge_proxy_public
      summary: Delete proxy profile
      description: Delete an edge proxy profile.
      operationId: delete_proxy_profile_api_edge_proxy_v3_profiles__proxy_profile_id__delete
      parameters:
      - name: proxy_profile_id
        in: path
        required: true
        schema:
          type: integer
          title: Proxy Profile Id
      responses:
        '204':
          description: Successful Response
        '400':
          description: Edge proxy service is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
          description: Forbidden
        '404':
          description: Proxy profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /security/edgeproxy/v3/profiles/{proxy_profile_id}/redeploy:
    post:
      tags:
      - v3
      - edge_proxy
      - proxy profiles
      - public
      - edge_proxy_public
      summary: Redeploy proxy profile
      description: Redeploy an edge proxy profile.
      operationId: redeploy_proxy_profile_api_edge_proxy_v3_profiles__proxy_profile_id__redeploy_post
      parameters:
      - name: proxy_profile_id
        in: path
        required: true
        schema:
          type: integer
          title: Proxy Profile Id
      responses:
        '202':
          description: Accepted. The operation runs asynchronously; poll GET /v3/profiles/{`proxy_profile_id`} for status.
          content:
            application/json:
              schema: {}
        '400':
          description: Edge proxy service is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
          description: Forbidden
        '404':
          description: Proxy profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '409':
          description: Conflict - operation in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /security/edgeproxy/v3/profiles/{proxy_profile_id}/activate:
    post:
      tags:
      - v3
