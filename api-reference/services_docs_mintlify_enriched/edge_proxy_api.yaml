      - edge_proxy_public
      summary: Activate proxy profile
      description: Activate an edge proxy profile.
      operationId: activate_proxy_profile_api_edge_proxy_v3_profiles__proxy_profile_id__activate_post
      parameters:
      - name: proxy_profile_id
        in: path
        required: true
        schema:
          type: integer
          title: Proxy Profile Id
      responses:
        '202':
          description: Accepted. The operation runs asynchronously; poll GET /v3/profiles/{`proxy_profile_id`} for status.
          content:
            application/json:
              schema: {}
        '400':
          description: Edge proxy service is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
          description: Forbidden
        '404':
          description: Proxy profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '409':
          description: Conflict - already active or operation in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /security/edgeproxy/v3/profiles/{proxy_profile_id}/deactivate:
    post:
      tags:
