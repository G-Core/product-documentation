openapi: 3.1.0
info:
  title: Gcore OpenAPI – Edge Proxy API
  description: This OpenAPI is an aggregated OpenAPI specification that unifies all Gcore products into a single file. It covers Cloud, CDN, DNS, WAAP, DDoS Protection, Object Storage, Streaming, and FastEdge services.
  version: f71fd1004da1
servers:
- url: https://api.gcore.com
tags:
- name: Proxy profiles
  description: 'A proxy profile is your proxied service: a protected IPv4 address in front of an origin host, rendered with a proxy template, plus the ports to forward, grouped by the template''s policies.'
- name: Proxy templates
  description: A proxy template is a ready-made proxy configuration managed by Gcore. It defines the policies you can assign to the ports of a proxy profile.
paths:
  /security/edgeproxy/v3/profiles:
    get:
      tags:
      - Proxy profiles
      summary: List proxy profiles
      description: List proxy profiles with optional filtering by client, status, and search (matches name, origin IP, or protected IP). Sorting by default is by 'created_at' field desc.
      operationId: listProxyProfiles
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ProxyProfileStatus'
          - type: 'null'
          title: Status
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          description: Search by name, origin IP or protected IP
          title: Search
        description: Search by name, origin IP or protected IP
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000000000
          minimum: 0
          default: 0
          title: Offset
      - name: order_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          description: Comma-separated sort fields, e.g. 'created_at.desc' or '-created_at'
          title: Order By
        description: Comma-separated sort fields, e.g. 'created_at.desc' or '-created_at'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponse_ProxyProfileClientResponse_'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
          description: Forbidden
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Proxy profiles
      summary: Create proxy profile
      description: Create a new edge proxy profile with ACL rules. Omit `protected_ip_address` or use null for automatic allocation. For manual selection, supply an IPv4 string from any non-common pool assigned to the target customer, including restricted shared pools. Manual failures never substitute another address or pool.
      operationId: createProxyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProxyProfileClientCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyProfileClientResponse'
        '400':
          description: Address conflicts with active protection configuration, requested protected IP is already allocated, no protected IP is available in the client's pools, origin host is already used by another active profile, profile limit per client reached, or edge proxy service is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '403':
          description: Requested protected IP is not in your assigned pools.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '409':
          description: Requested protected IP is locked by another request; retry later
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /security/edgeproxy/v3/profiles/{proxy_profile_id}:
    get:
      tags:
      - Proxy profiles
      summary: Get proxy profile
      description: Get a specific proxy profile
      operationId: getProxyProfile
      parameters:
      - name: proxy_profile_id
        in: path
        required: true
        schema:
          type: integer
          title: Proxy Profile Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyProfileClientResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
          description: Forbidden
        '404':
          description: Proxy profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Proxy profiles
      summary: Replace proxy profile
      description: Replace an existing edge proxy profile's name, origin, template and ACL rules.
      operationId: replaceProxyProfile
      parameters:
      - name: proxy_profile_id
        in: path
        required: true
        schema:
          type: integer
          title: Proxy Profile Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProxyProfileRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyProfileClientResponse'
        '400':
          description: Origin host is already used by another active profile, no protected IP is available in the client's pools, or edge proxy service is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
          description: Forbidden
        '404':
          description: Proxy profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '409':
          description: Another operation is in progress for this profile; retry later
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Proxy profiles
      summary: Update proxy profile
      description: Update the given fields of an existing edge proxy profile; omitted fields are kept.
      operationId: updateProxyProfile
      parameters:
      - name: proxy_profile_id
        in: path
        required: true
        schema:
          type: integer
          title: Proxy Profile Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchProxyProfileRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyProfileClientResponse'
        '400':
          description: Origin host is already used by another active profile, no protected IP is available in the client's pools, or edge proxy service is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
          description: Forbidden
        '404':
          description: Proxy profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '409':
          description: Another operation is in progress for this profile; retry later
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Proxy profiles
      summary: Delete proxy profile
      description: Delete an edge proxy profile.
      operationId: deleteProxyProfile
      parameters:
      - name: proxy_profile_id
        in: path
        required: true
        schema:
          type: integer
          title: Proxy Profile Id
      responses:
        '204':
          description: Successful Response
        '400':
          description: Edge proxy service is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
          description: Forbidden
        '404':
          description: Proxy profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '409':
          description: Another operation is in progress for this profile; retry later
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /security/edgeproxy/v3/profiles/{proxy_profile_id}/redeploy:
    post:
      tags:
      - Proxy profiles
      summary: Redeploy proxy profile
      description: Redeploy an edge proxy profile.
      operationId: redeployProxyProfile
      parameters:
      - name: proxy_profile_id
        in: path
        required: true
        schema:
          type: integer
          title: Proxy Profile Id
      responses:
        '202':
          description: Accepted. The operation runs asynchronously; poll GET /v3/profiles/{`proxy_profile_id`} for status.
        '400':
          description: No protected IP is available in the client's pools, or edge proxy service is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
          description: Forbidden
        '404':
          description: Proxy profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '409':
          description: Another operation is in progress for this profile; retry later
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /security/edgeproxy/v3/profiles/{proxy_profile_id}/activate:
    post:
      tags:
      - Proxy profiles
      summary: Activate proxy profile
      description: Activate an edge proxy profile.
      operationId: activateProxyProfile
      parameters:
      - name: proxy_profile_id
        in: path
        required: true
        schema:
          type: integer
          title: Proxy Profile Id
      responses:
        '202':
          description: Accepted. The operation runs asynchronously; poll GET /v3/profiles/{`proxy_profile_id`} for status.
        '400':
          description: Profile is already active, no protected IP is available in the client's pools, or edge proxy service is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
          description: Forbidden
        '404':
          description: Proxy profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '409':
          description: Another operation is in progress for this profile; retry later
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /security/edgeproxy/v3/profiles/{proxy_profile_id}/deactivate:
    post:
      tags:
      - Proxy profiles
      summary: Deactivate proxy profile
      description: Deactivate an edge proxy profile.
      operationId: deactivateProxyProfile
      parameters:
      - name: proxy_profile_id
        in: path
        required: true
        schema:
          type: integer
          title: Proxy Profile Id
      responses:
        '202':
          description: Accepted. The operation runs asynchronously; poll GET /v3/profiles/{`proxy_profile_id`} for status.
        '400':
          description: Profile is already inactive, or edge proxy service is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
          description: Forbidden
        '404':
          description: Proxy profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '409':
          description: Another operation is in progress for this profile; retry later
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /security/edgeproxy/v3/templates:
    get:
      tags:
      - Proxy templates
      summary: List proxy templates
      description: List proxy templates visible to the caller (own + common default). Sorted by id ascending unless `order_by` is given.
      operationId: listProxyTemplates
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000000000
          minimum: 0
          default: 0
          title: Offset
      - name: order_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          description: Comma-separated sort fields, e.g. 'id.desc' or '-id'
          title: Order By
        description: Comma-separated sort fields, e.g. 'id.desc' or '-id'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponse_ProxyTemplateUserResponse_'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
          description: Forbidden
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /security/edgeproxy/v3/templates/{template_id}:
    get:
      tags:
      - Proxy templates
      summary: Get proxy template
      description: Get a proxy template visible to the caller (own or common default).
      operationId: getProxyTemplate
      parameters:
      - name: template_id
        in: path
        required: true
        schema:
          type: integer
          maximum: 1000000000
          minimum: 1
          description: A positive integer ID
          title: Template Id
        description: A positive integer ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyTemplateUserResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
          description: Forbidden
        '404':
          description: Proxy template not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /security/edgeproxy/v3/acl_limit:
    get:
      tags:
      - Proxy profiles
      summary: Get ACL limit
      description: Get the client's ACL rule limit and current usage count.
      operationId: getAclLimit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AclLimitResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /security/edgeproxy/v3/available_addresses:
    get:
      tags:
      - Proxy profiles
      summary: List available protected IPv4 addresses
      description: 'List unallocated addresses from the customer''s assigned non-common pools, in numeric IP order. Common pools are excluded; customers without assigned pools retain automatic allocation. Empty results mean no assigned pools, empty or fully allocated pools, no prefix matches, or no matches after the cursor. Listing does not reserve addresses: creation rechecks membership and availability. Keep `starts_with` across pages and reset cursor when the filter changes.'
      operationId: listAvailableAddresses
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: ipv4
          - type: 'null'
          description: Last returned IPv4 address; continue with greater addresses
          title: Cursor
        description: Last returned IPv4 address; continue with greater addresses
      - name: starts_with
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 15
            pattern: ^[0-9.]*$
          - type: 'null'
          description: Textual host IPv4 prefix, e.g. 192.0.2.1 matches .1, .10, .100. Empty disables filtering.
          title: Starts With
        description: Textual host IPv4 prefix, e.g. 192.0.2.1 matches .1, .10, .100. Empty disables filtering.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableAddressesResponse'
        '400':
          description: Edge proxy service is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
          description: Forbidden
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ACLProtocol:
      type: string
      enum:
      - tcp
      - udp
      title: ACLProtocol
    AclLimitResponse:
      properties:
        total_acl_limit:
          type: integer
          title: Total Acl Limit
          description: Maximum ACL rules allowed for the client
        current_acl_count:
          type: integer
          title: Current Acl Count
          description: Total ACL rules across all non-deleted profiles
      type: object
      required:
      - total_acl_limit
      - current_acl_count
      title: AclLimitResponse
    AvailableAddressesResponse:
      properties:
        results:
          items:
            type: string
            format: ipv4
          type: array
          title: Results
        next_cursor:
          anyOf:
          - type: string
            format: ipv4
          - type: 'null'
          title: Next Cursor
      type: object
      required:
      - results
      - next_cursor
      title: AvailableAddressesResponse
      example:
        next_cursor: 192.0.2.11
        results:
        - 192.0.2.10
        - 192.0.2.11
    ErrorDescription:
      properties:
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        details:
          anyOf:
          - items: {}
            type: array
          - additionalProperties: true
            type: object
          - type: string
          - type: 'null'
          title: Details
      type: object
      required:
      - error
      - details
      title: ErrorDescription
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    PageResponse_ProxyProfileClientResponse_:
      properties:
        count:
          type: integer
          title: Count
        next:
          anyOf:
          - type: string
          - type: 'null'
          title: Next
        previous:
          anyOf:
          - type: string
          - type: 'null'
          title: Previous
        results:
          items:
            $ref: '#/components/schemas/ProxyProfileClientResponse'
          type: array
          title: Results
      type: object
      required:
      - count
      - next
      - previous
      - results
      title: PageResponse[ProxyProfileClientResponse]
      example:
        count: 25
        next: https://api.example.com/items?offset=10&limit=10
        results: []
    PageResponse_ProxyTemplateUserResponse_:
      properties:
        count:
          type: integer
          title: Count
        next:
          anyOf:
          - type: string
          - type: 'null'
          title: Next
        previous:
          anyOf:
          - type: string
          - type: 'null'
          title: Previous
        results:
          items:
            $ref: '#/components/schemas/ProxyTemplateUserResponse'
          type: array
          title: Results
      type: object
      required:
      - count
      - next
      - previous
      - results
      title: PageResponse[ProxyTemplateUserResponse]
      example:
        count: 25
        next: https://api.example.com/items?offset=10&limit=10
        results: []
    PatchProxyProfileRequest:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 60
            minLength: 1
          - type: 'null'
          title: Name
          description: Name of the proxy profile
        origin_host:
          anyOf:
          - type: string
          - type: 'null'
          title: Origin Host
          description: Origin host (IPv4 address or FQDN) for the proxy profile.
        rules:
          anyOf:
          - items:
              $ref: '#/components/schemas/PolicyRulesInput'
            type: array
            minItems: 1
          - type: 'null'
          title: Rules
          description: Rules grouped by policy
        template_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Template Id
          description: ID of the proxy template to render this profile with
      type: object
      title: PatchProxyProfileRequest
      example:
        name: web-server-profile-patched
        template_id: 3
    PolicyRulesInput:
      properties:
        policy:
          type: string
          title: Policy
          description: Policy that this group of mappings is associated with
        mappings:
          items:
            $ref: '#/components/schemas/RuleMappingInput'
          type: array
          minItems: 1
          title: Mappings
          description: Protocol/port mappings for this policy
      type: object
      required:
      - policy
      - mappings
      title: PolicyRules
      example:
        mappings:
        - port: 2222
          protocol: tcp
        policy: minecraft
    PolicyRulesOutput:
      properties:
        policy:
          type: string
          title: Policy
          description: Policy that this group of mappings is associated with
        mappings:
          items:
            $ref: '#/components/schemas/RuleMappingOutput'
          type: array
          minItems: 1
          title: Mappings
          description: Protocol/port mappings for this policy
      type: object
      required:
      - policy
      - mappings
      title: PolicyRules
      example:
        mappings:
        - port: 2222
          protocol: tcp
        policy: minecraft
    ProxyProfileClientCreateRequest:
      properties:
        name:
          type: string
          maxLength: 60
          minLength: 1
          title: Name
          description: Name of the proxy profile
        origin_host:
          type: string
          title: Origin Host
          description: Origin host (IPv4 address or FQDN) for the proxy profile.
        rules:
          items:
            $ref: '#/components/schemas/PolicyRulesInput'
          type: array
          minItems: 1
          title: Rules
          description: Rules grouped by policy
        template_id:
          type: integer
          title: Template Id
          description: ID of the proxy template to render this profile with
        protected_ip_address:
          anyOf:
          - type: string
            format: ipv4
          - type: 'null'
          title: Protected Ip Address
          description: Optional manual IPv4 selection from any assigned non-common pool, including shared pools. Omit or use null for automatic allocation. Creation rechecks availability; no fallback on manual failure.
          examples:
          - 192.0.2.10
          - null
      type: object
      required:
      - name
      - origin_host
      - rules
      - template_id
      title: ProxyProfileClientCreateRequest
      example:
        name: web-server-profile
        origin_host: 8.8.8.8
        rules:
        - mappings:
          - port: 80
            protocol: tcp
            proxy_protocol:
              accept_proxy: true
              version: '2'
          - port: 53
            protocol: udp
          policy: allow
        template_id: 3
    ProxyProfileClientResponse:
      properties:
        id:
          type: integer
          title: Id
          description: Unique identifier of the proxy profile
        client_id:
          type: integer
          title: Client Id
          description: Identifier of the client owning this profile
        name:
          type: string
          title: Name
          description: Name of the proxy profile
        origin_host:
          type: string
          title: Origin Host
          description: Origin host (IPv4 address or FQDN) of the proxy profile
        protected_ip_address:
          anyOf:
          - type: string
            format: ipv4
          - type: 'null'
          title: Protected Ip Address
          description: Protected IP address assigned to the profile
        status:
          $ref: '#/components/schemas/ProxyProfileStatus'
          description: Current status of the proxy profile
        mode:
          $ref: '#/components/schemas/ProxyProfileMode'
          description: 'Operating mode, set by the template: ''regular'' proxies traffic through the edge proxy; ''shield'' also routes it through the template''s shield sites'
        is_processing:
          type: boolean
          title: Is Processing
          description: Whether the profile is currently being processed
        is_error:
          type: boolean
          title: Is Error
          description: Whether the profile is in an error state
        error_details:
          anyOf:
