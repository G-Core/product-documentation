          description: Details of the error if the profile is in an error state
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Timestamp when the profile was created
        template_id:
          type: integer
          title: Template Id
          description: ID of the proxy template bound to this profile
        rules:
          items:
            $ref: '#/components/schemas/PolicyRulesOutput'
          type: array
          title: Rules
          readOnly: true
      type: object
      required:
      - id
      - client_id
      - name
      - origin_host
      - protected_ip_address
      - status
      - mode
      - is_processing
      - is_error
      - error_details
      - created_at
      - template_id
      - rules
      title: ProxyProfileClientResponse
      example:
        client_id: 7
        created_at: '2025-11-15T10:30:00Z'
        id: 42
        is_error: false
        is_processing: false
        name: web-server-profile
        origin_host: 8.8.8.8
        protected_ip_address: 10.0.0.50
        rules:
        - mappings:
          - port: 80
            protocol: tcp
            proxy_protocol:
              accept_proxy: true
              version: '2'
            rule_id: 3f2b8c1e-5d4a-4e6b-9c7d-1a2b3c4d5e6f
          - port: 53
            protocol: udp
            rule_id: 7a9e0d2c-4b1f-4c3a-8e5d-6f7a8b9c0d1e
          policy: allow
        status: ACTIVE
        template_id: 3
