openapi: 3.1.0
info:
  title: "Badges demo (internal test)"
  version: "1.0.0"
  description: >
    Internal test spec to demonstrate Mintlify labels on API endpoints and parameters.
    Shows: x-mint.metadata.tag in the sidebar, x-mint.content Badge on the page,
    x-mint.pre / x-mint.post parameter pills, and native deprecated operations.

tags:
  - name: Standard
    description: Regular endpoints — no special labels
  - name: Beta
    description: Endpoints labeled BETA in the sidebar via x-mint.metadata.tag
  - name: coming-soon
    x-group: Coming soon
    description: Endpoints labeled Coming soon in the sidebar via x-mint.metadata.tag
  - name: New
    description: Endpoints labeled NEW in the sidebar via x-mint.metadata.tag
  - name: Deprecated
    description: Endpoints using native deprecated field

paths:

  /load-balancers:
    get:
      operationId: listLoadBalancers
      tags: [Standard]
      summary: List load balancers
      description: Returns a list of all load balancers in the project. No special labels — baseline for comparison.
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            type: integer
          description: Numeric project identifier.
        - name: region_id
          in: query
          required: true
          schema:
            type: integer
          description: Numeric region identifier.
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
          description: Maximum number of results to return.
      responses:
        "200":
          description: List of load balancers.

  /load-balancers/network-optimised:
    post:
      operationId: createNetworkOptimisedLB
      tags: [Beta]
      summary: Create a network-optimised load balancer
      description: >
        Creates an lb2 network-optimised load balancer.
        The operation uses **x-mint.metadata.tag** so a `BETA` label appears next to the
        endpoint name in the sidebar. The `flavor` parameter uses **x-mint.pre** for a
        `BETA` pill. The `bandwidth_gbps` parameter uses **x-mint.post** for an `lb2 only` pill.
      x-mint:
        metadata:
          tag: "BETA"
        content: |
          <Info>
          This endpoint is in beta. <Badge color="blue">BETA</Badge>
          </Info>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, region_id, flavor]
              properties:
                project_id:
                  type: integer
                  description: Numeric project identifier.
                region_id:
                  type: integer
                  description: Numeric region identifier.
                flavor:
                  type: string
                  description: "Load balancer flavor. lb2 flavors: lb2-2-2, lb2-4-4, lb2-8-8, lb2-16-16."
                  example: lb2-4-4
                  x-mint:
                    pre: ["BETA"]
                bandwidth_gbps:
                  type: integer
                  description: Guaranteed network bandwidth in Gbps. Applies to lb2 flavors only.
                  example: 5
                  x-mint:
                    post: ["lb2 only"]
                qos_policy_id:
                  type: string
                  format: uuid
                  description: QoS policy UUID. Required when bandwidth_gbps is specified.
                  x-mint:
                    pre: ["CONDITIONAL"]
      responses:
        "201":
          description: Load balancer created.

  /load-balancers/{lb_id}/stats:
    get:
      operationId: getLoadBalancerStats
      tags: [Beta]
      summary: Get load balancer statistics
      description: >
        Returns performance statistics for a load balancer.
        The `resolution` parameter uses **x-mint.post** to show a `preview` pill.
        The `include_lb2_metrics` parameter combines **x-mint.pre** and **x-mint.post**.
      x-mint:
        metadata:
          tag: "BETA"
      parameters:
        - name: lb_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Load balancer UUID.
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Start of the time range (ISO 8601).
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: End of the time range (ISO 8601).
        - name: resolution
          in: query
          schema:
            type: string
            enum: [1m, 5m, 1h]
            default: 5m
          description: Time series resolution.
          x-mint:
            post: ["preview"]
        - name: include_lb2_metrics
          in: query
          schema:
            type: boolean
            default: false
          description: Include lb2-specific QoS and bandwidth metrics in the response.
          x-mint:
            pre: ["BETA"]
            post: ["lb2 only"]
      responses:
        "200":
          description: Statistics object.

  /load-balancers/ai-accelerator:
    post:
      operationId: createAiAcceleratedLB
      tags: [coming-soon]
      summary: Create an AI-accelerated load balancer
      description: >
        Creates a load balancer with AI-assisted traffic steering.
        The operation uses **x-mint.metadata.tag** so a `Coming soon` label appears next
        to the endpoint name in the sidebar. The page also injects an on-page
        **Badge** via **x-mint.content**.
      x-mint:
        metadata:
          tag: "Coming soon"
        content: |
          <Info>
          This endpoint is not available yet. <Badge color="yellow">Coming soon</Badge>
          </Info>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, region_id, name]
              properties:
                project_id:
                  type: integer
                  description: Numeric project identifier.
                region_id:
                  type: integer
                  description: Numeric region identifier.
                name:
                  type: string
                  description: Display name for the load balancer.
                steering_mode:
                  type: string
                  enum: [latency, cost, availability]
                  description: Traffic steering strategy. The API does not accept this field yet.
                  x-mint:
                    post: ["Coming soon"]
      responses:
        "201":
          description: Load balancer created.

  /load-balancers/global-anycast:
    post:
      operationId: createGlobalAnycastLB
      tags: [New]
      summary: Create a global anycast load balancer
      description: >
        Creates a global anycast load balancer.
        The operation uses **x-mint.metadata.tag** so a `NEW` label appears next to the
        endpoint name in the sidebar.
      x-mint:
        metadata:
          tag: "NEW"
        content: |
          <Tip>
          This endpoint is generally available. <Badge color="green">NEW</Badge>
          </Tip>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, name]
              properties:
                project_id:
                  type: integer
                  description: Numeric project identifier.
                name:
                  type: string
                  description: Display name for the load balancer.
                anycast_ip:
                  type: string
                  format: ipv4
                  description: Anycast IP address assigned to the load balancer.
                  x-mint:
                    pre: ["NEW"]
      responses:
        "201":
          description: Load balancer created.

  /load-balancers/v1/list:
    get:
      operationId: listLoadBalancersV1Deprecated
      tags: [Deprecated]
      deprecated: true
      summary: List load balancers (v1)
      description: >
        **Deprecated.** Use `GET /load-balancers` instead.
        This endpoint is marked with the native OpenAPI `deprecated: true` field.
        Mintlify renders a built-in Deprecated indicator on the operation automatically — no extension needed.
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            type: integer
          description: Numeric project identifier.
      responses:
        "200":
          description: List of load balancers (legacy format).
