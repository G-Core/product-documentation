openapi: 3.1.0
info:
  title: Gcore OpenAPI – Cloud Reseller API
  description: This OpenAPI is an aggregated OpenAPI specification that unifies all Gcore products into a single file. It covers Cloud, CDN, DNS, WAAP, DDoS Protection, Object Storage, Streaming, and FastEdge services.
  version: 3594b27d2933
servers:
- url: https://api.gcore.com
paths:
  /cloud/reseller/v1/limits_request:
    get:
      operationId: ResellerLimitRequestsCollection.get
      summary: List quota limit requests
      description: |-
        Retrieve quota limit requests from your reseller clients.
        Filter by client ID or request status to find specific requests.
        Use this endpoint to review pending requests before approval or rejection.
      parameters:
      - in: query
        name: client_id
        required: false
        description: Filter requests by specific client ID. Omit to see requests from all your reseller clients.
        schema:
          description: Filter requests by specific client ID. Omit to see requests from all your reseller clients.
          example: 123
          examples:
          - 123
          title: Client Id
          type: integer
      - in: query
        name: limit
        required: false
        description: Limit the number of returned items
        schema:
          default: 1000
          description: Limit the number of returned items
          example: 1000
          examples:
          - 1000
          exclusiveMinimum: 0
          maximum: 1000
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        description: Offset value is used to exclude the first set of records from the result
        schema:
          default: 0
          description: Offset value is used to exclude the first set of records from the result
          example: 0
          examples:
          - 0
          minimum: 0
          title: Offset
          type: integer
      - in: query
        name: status
        required: false
        description: List of limit requests statuses for filtering
        schema:
          description: List of limit requests statuses for filtering
          example: &id001
          - done
          - in progress
          examples:
          - *id001
          items:
            $ref: '#/components/schemas/LimitsRequestStatus'
          title: Status
          type: array
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResellerLimitsRequestCollectionSerializer'
        '400':
          $ref: '#/components/responses/ProblemBadRequestOnReadWithLegacyKeys'
        '401':
          $ref: '#/components/responses/ProblemUnauthorizedWithLegacyKeys'
        '403':
          $ref: '#/components/responses/ProblemForbiddenWithLegacyKeys'
        '404':
          $ref: '#/components/responses/ProblemNotFoundWithLegacyKeys'
        '409':
          $ref: '#/components/responses/ProblemConflictWithLegacyKeys'
        '500':
          $ref: '#/components/responses/ProblemInternalServerErrorWithLegacyKeys'
        '503':
          $ref: '#/components/responses/ProblemServiceUnavailableWithLegacyKeys'
      tags:
      - Quotas
  /cloud/reseller/v1/limits_request/{request_id}:
    patch:
      operationId: ResellerLimitRequestsDetail.patch
      summary: Update quota limit request status
      description: |-
        Approve or reject a quota limit request from your reseller client. When approved, the new quotas
        are automatically applied to the client account. When rejected, the client receives a notification email.
      parameters:
      - in: path
        name: request_id
        required: true
        description: LimitRequest ID
        schema:
          description: LimitRequest ID
          example: 3
          examples:
          - 3
          format: int64
          title: Request Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResellerLimitsRequestSerializer'
        '400':
          $ref: '#/components/responses/ProblemBadRequestWithLegacyKeys'
        '401':
          $ref: '#/components/responses/ProblemUnauthorizedWithLegacyKeys'
        '403':
          $ref: '#/components/responses/ProblemForbiddenWithLegacyKeys'
        '404':
          $ref: '#/components/responses/ProblemNotFoundWithLegacyKeys'
        '409':
          $ref: '#/components/responses/ProblemConflictWithLegacyKeys'
        '500':
          $ref: '#/components/responses/ProblemInternalServerErrorWithLegacyKeys'
        '503':
          $ref: '#/components/responses/ProblemServiceUnavailableWithLegacyKeys'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResellerChangeStatusSerializer'
      tags:
      - Quotas
