openapi: 3.1.0
info:
  title: Gcore OpenAPI – Cloud Reseller API
  description: This OpenAPI is an aggregated OpenAPI specification that unifies all Gcore products into a single file. It covers Cloud, CDN, DNS, WAAP, DDoS Protection, Object Storage, Streaming, and FastEdge services.
  version: 354026771df1
servers:
- url: https://api.gcore.com
paths:
  /cloud/reseller/v1/cost_report/breakdown:
    post:
      operationId: ResellerCostReportBreakdownHandler.post
      summary: Get daily cost breakdown of a client (pay-as-you-go only)
      description: |-
        Get the daily costs of a client of your reseller account, grouped by one dimension: region (default),
        project, resource type or flavor. The period must not be longer than 31 days.

        The response can have more than one row for one day and one `group_by` value. Usage with a different
        unit (`usage.unit`) is in a different row. Usage without a price (`error` is not null) is also in a
        different row.

        If your reseller account pays for the usage of its clients, the client has no costs of its own.
        For such a client, the request returns an error.

        The report does not include the commit features (prepaid resources) of the billing plan.
        Usage data of the last hour can be incomplete. Most data is available in 24 hours.
      parameters: []
      responses:
        '200':
          description: Daily cost breakdown of the client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostReportBreakdownResponseSerializer'
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '409':
          $ref: '#/components/responses/ProblemConflict'
        '500':
          $ref: '#/components/responses/ProblemInternalServerError'
        '503':
          $ref: '#/components/responses/ProblemServiceUnavailable'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResellerCostReportBreakdownRequestSerializer'
      tags:
      - Cost Reports
  /cloud/reseller/v1/limits_request:
    get:
      operationId: ResellerLimitRequestsCollection.get
      summary: List quota limit requests
      description: |-
        Retrieve quota limit requests from your reseller clients.
        Filter by client ID or request status to find specific requests.
        Use this endpoint to review pending requests before approval or rejection.
      parameters:
      - in: query
        name: client_id
        required: false
        description: Filter requests by specific client ID. Omit to see requests from all your reseller clients.
        schema:
          description: Filter requests by specific client ID. Omit to see requests from all your reseller clients.
          example: 123
          examples:
          - 123
          title: Client Id
          type: integer
      - in: query
        name: limit
        required: false
        description: Limit the number of returned items
        schema:
          default: 1000
          description: Limit the number of returned items
          example: 1000
          examples:
          - 1000
          exclusiveMinimum: 0
          maximum: 1000
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        description: Offset value is used to exclude the first set of records from the result
        schema:
          default: 0
          description: Offset value is used to exclude the first set of records from the result
          example: 0
          examples:
          - 0
          minimum: 0
          title: Offset
          type: integer
      - in: query
        name: status
        required: false
        description: List of limit requests statuses for filtering
        schema:
          description: List of limit requests statuses for filtering
          example: &id001
          - done
          - in progress
          examples:
          - *id001
          items:
            $ref: '#/components/schemas/LimitsRequestStatus'
          title: Status
          type: array
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResellerLimitsRequestCollectionSerializer'
        '400':
          $ref: '#/components/responses/ProblemBadRequestOnReadWithLegacyKeys'
        '401':
          $ref: '#/components/responses/ProblemUnauthorizedWithLegacyKeys'
        '403':
          $ref: '#/components/responses/ProblemForbiddenWithLegacyKeys'
        '404':
          $ref: '#/components/responses/ProblemNotFoundWithLegacyKeys'
        '409':
          $ref: '#/components/responses/ProblemConflictWithLegacyKeys'
        '500':
          $ref: '#/components/responses/ProblemInternalServerErrorWithLegacyKeys'
        '503':
          $ref: '#/components/responses/ProblemServiceUnavailableWithLegacyKeys'
      tags:
      - Quotas
  /cloud/reseller/v1/limits_request/{request_id}:
    patch:
      operationId: ResellerLimitRequestsDetail.patch
      summary: Update quota limit request status
      description: |-
        Approve or reject a quota limit request from your reseller client. When approved, the new quotas
        are automatically applied to the client account. When rejected, the client receives a notification email.
      parameters:
      - in: path
        name: request_id
        required: true
        description: LimitRequest ID
        schema:
          description: LimitRequest ID
          example: 3
          examples:
          - 3
          format: int64
          title: Request Id
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResellerLimitsRequestSerializer'
        '400':
          $ref: '#/components/responses/ProblemBadRequestWithLegacyKeys'
        '401':
          $ref: '#/components/responses/ProblemUnauthorizedWithLegacyKeys'
        '403':
          $ref: '#/components/responses/ProblemForbiddenWithLegacyKeys'
        '404':
          $ref: '#/components/responses/ProblemNotFoundWithLegacyKeys'
        '409':
          $ref: '#/components/responses/ProblemConflictWithLegacyKeys'
        '500':
          $ref: '#/components/responses/ProblemInternalServerErrorWithLegacyKeys'
        '503':
          $ref: '#/components/responses/ProblemServiceUnavailableWithLegacyKeys'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResellerChangeStatusSerializer'
      tags:
      - Quotas
components:
  schemas:
    AllClientQuotasLimitsSerializer:
      properties:
        global_limits:
          $ref: '#/components/schemas/CreateGlobalQuotasLimitsSerializer'
          description: Global entity quota limits
        regional_limits:
          description: Regions and their quota limits
          items:
            $ref: '#/components/schemas/RegionalQuotasLimitsSerializer'
          title: Regional Limits
          type: array
      title: Global and regional quota limits of the client.
      type: object
    CostReportBreakdownGroupBy:
      description: Dimension the breakdown rows are summed down to, on top of the always-present date.
      enum:
      - flavor
      - project
      - region
      - type
      title: CostReportBreakdownGroupBy
      type: string
    CostReportBreakdownResponseSerializer:
      properties:
        count:
          description: Count of returned rows
          example: 7
          examples:
          - 7
          minimum: 0
          title: Count
          type: integer
        price_status:
          $ref: '#/components/schemas/CostReportPriceDisplayStatus'
          description: '''show'' when the client may see prices, ''hide'' for trial clients, clients with no product status, and clients of a reseller that does not expose prices. This report never returns ''error''.'
        results:
          items:
            $ref: '#/components/schemas/CostReportBreakdownResultSerializer'
          title: Results
          type: array
      required:
      - count
      - results
      - price_status
      title: CostReportBreakdownResponseSerializer
      type: object
    CostReportBreakdownResultSerializer:
      description: One day of usage for one `group_by` value.
      properties:
        date:
          description: Day the usage was billed for
          example: '2026-07-17'
          examples:
          - '2026-07-17'
          format: date
          title: Date
          type: string
        error:
          anyOf:
          - $ref: '#/components/schemas/CostReportCostError'
          - type: 'null'
          description: Why the cost is missing, set only when cost is null
          examples:
          - null
        flavor:
          anyOf:
          - type: string
          - type: 'null'
          description: Flavor name, set when `group_by` is 'flavor'
          examples:
          - bm2-infrastructure-medium
          title: Flavor
        project_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: Project ID, set when `group_by` is 'project'
          examples:
          - 101
          title: Project Id
        region_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: Region ID, set when `group_by` is 'region'. 0 means global usage that has no region.
          examples:
          - 76
          title: Region Id
        type:
          anyOf:
          - $ref: '#/components/schemas/PrebillingResourceTypes'
          - type: 'null'
          description: Resource type, set when `group_by` is 'type' or 'flavor'
          examples:
          - baremetal
        usage:
          $ref: '#/components/schemas/CostReportBreakdownUsageSerializer'
      required:
      - date
      - type
      - flavor
      - region_id
      - project_id
      - usage
      - error
      title: CostReportBreakdownResultSerializer
      type: object
    CostReportBreakdownUsageSerializer:
      description: How much the group was used that day, and what that costs.
      properties:
        cost:
          anyOf:
          - type: number
          - type: 'null'
          description: Cost for the day, never rounded. Null if there is no price.
          examples:
          - 163.190753
          title: Cost
        currency:
          anyOf:
          - type: string
          - type: 'null'
          description: Currency of the cost, null if there is no cost
          examples:
          - EUR
          title: Currency
        unit:
          description: Unit of the billing value
          example: minutes
          examples:
          - minutes
          title: Unit
          type: string
        value:
          description: Usage of the billing metric for the day, in `unit`, kept at full precision.
          example: 6688
          examples:
          - 6688
          title: Value
          type: number
      required:
      - value
      - unit
      - cost
      - currency
      title: CostReportBreakdownUsageSerializer
      type: object
    CostReportCostError:
      description: Why a row has no cost. Values are the plain strings v1 has always returned.
      enum:
      - Multiple subscriptions
      - No tariff
      title: CostReportCostError
      type: string
    CostReportPriceDisplayStatus:
      enum:
      - error
      - hide
      - show
      title: CostReportPriceDisplayStatus
      type: string
    CostReportResourcesResponseFormat:
      enum:
      - csv_records
      - json
      title: CostReportResourcesResponseFormat
      type: string
    CreateGlobalQuotasLimitsSerializer:
      additionalProperties: false
      properties:
        inference_cpu_millicore_count_limit:
          description: Inference CPU millicore count limit
          example: 0
          examples:
          - 0
          title: Inference Cpu Millicore Count Limit
          type: integer
        inference_gpu_a100_count_limit:
          description: Inference GPU A100 Count limit
          example: 0
          examples:
          - 0
          title: Inference Gpu A100 Count Limit
          type: integer
        inference_gpu_h100_count_limit:
          description: Inference GPU H100 Count limit
          example: 0
          examples:
          - 0
          title: Inference Gpu H100 Count Limit
          type: integer
        inference_gpu_l40s_count_limit:
          description: Inference GPU L40s Count limit
          example: 0
          examples:
          - 0
          title: Inference Gpu L40S Count Limit
          type: integer
        inference_instance_count_limit:
          description: Inference instance count limit
          example: 0
          examples:
          - 0
          title: Inference Instance Count Limit
          type: integer
        inference_public_model_api_key_count_limit:
          description: Public model API keys count limit
          example: 0
          examples:
          - 0
          title: Inference Public Model Api Key Count Limit
          type: integer
        keypair_count_limit:
          description: SSH Keys Count limit
          example: 100
          examples:
          - 100
          title: Keypair Count Limit
          type: integer
        project_count_limit:
          description: Projects Count limit
          example: 2
          examples:
          - 2
          title: Project Count Limit
          type: integer
      title: Scheme for create GlobalQuotaLimits
      type: object
    LimitsRequestStatus:
      enum:
      - done
      - in progress
      - rejected
      title: LimitsRequestStatus
      type: string
    NotAvailableReason:
      enum:
      - account
      - balance
      - capacity
      - plan
      - region
      title: NotAvailableReason
      type: string
    PrebillingResourceTypes:
      description: Resource types for prebilling report
      enum:
      - ai_cluster
      - ai_virtual_cluster
      - backup
      - baremetal
      - basic_vm
      - containers
      - dbaas_postgresql_connection_pooler
      - dbaas_postgresql_cpu
      - dbaas_postgresql_memory
      - dbaas_postgresql_public_network
      - dbaas_postgresql_volume
      - egress_traffic
      - external_ip
      - file_share
      - floatingip
      - functions
      - functions_calls
      - functions_traffic
      - image
      - inference
      - inference_public_models
      - instance
      - load_balancer
      - log_index
      - snapshot
      - volume
      title: PrebillingResourceTypes
      type: string
    Problem:
      additionalProperties: false
      description: The error body, served as `application/problem+json`.
      properties:
        context:
          anyOf:
          - $ref: '#/components/schemas/ProblemContext'
          - type: 'null'
          default: null
          description: Data for the `type`. Absent on a type without context keys, and on a `not-found` for an unknown URL.
        detail:
          description: The facts of this occurrence.
          title: Detail
          type: string
        errors:
          anyOf:
          - items:
              $ref: '#/components/schemas/ProblemError'
            type: array
          - type: 'null'
          default: null
          description: One item for each invalid input. Only on `validation-error`, and absent when no single input is wrong.
          title: Errors
        hint:
          description: What to do next.
          title: Hint
          type: string
        request_id:
          description: ID of the request. The response also sends it in the `X-Request-Id` header. Quote it to support.
          title: Request Id
          type: string
        status:
          description: Copy of the HTTP status code.
          title: Status
          type: integer
        title:
          description: Fixed sentence for the `type`.
          title: Title
          type: string
        trace_id:
          anyOf:
          - type: string
          - type: 'null'
          description: W3C trace ID from the `traceparent` of the request. Null when the request has no valid `traceparent`.
          title: Trace Id
        type:
          $ref: '#/components/schemas/ProblemType'
          description: Stable error code in kebab-case, such as `not-found`. Clients branch on it. It is not `errors[].code`, which names what is wrong with one input in `snake_case`, such as `not_found`.
      required:
      - type
      - title
      - status
      - detail
      - hint
      - request_id
      - trace_id
      title: Problem
      type: object
    ProblemBlockingResource:
      additionalProperties: false
      description: One resource that blocks the request.
      properties:
        resource_id:
          description: ID of the blocking resource.
          title: Resource Id
          type: string
        resource_name:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Name of the blocking resource.
          title: Resource Name
        resource_type:
          description: Type of the blocking resource, as the permissions name it, such as `ports`.
          title: Resource Type
          type: string
      required:
      - resource_type
      - resource_id
      title: ProblemBlockingResource
      type: object
    ProblemContext:
      additionalProperties: false
      description: |-
        Data for the `type`. One flat object shared by all types. Each `type` always sends the same keys, and a key that the server cannot fill is `null`. The keys of each type:
        - `resource-in-use`: `blocking_resources`, `blocking_count`
        - `quota-exceeded`: `quotas`
        - `not-available`: `reason`, `region_id`, `resource_type`, `resource_id`
        - `permission-denied`: `operation`, `client_id`, `project_id`
        - `not-found`: `resource_type`, `resource_id`
        - `method-not-allowed`: `allowed_methods`
        - `resource-busy`: `resource_type`, `resource_id`, `resource_status`
        - `rate-limited`: `retry_after`
        - `service-unavailable`: `retry_after`
        The other types send no `context`, and neither does a `not-found` for an unknown URL.
      properties:
        allowed_methods:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          description: Methods that the endpoint supports.
          title: Allowed Methods
        blocking_count:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          description: Total number of blocking resources.
          title: Blocking Count
        blocking_resources:
          anyOf:
          - items:
              $ref: '#/components/schemas/ProblemBlockingResource'
            type: array
          - type: 'null'
          default: null
          description: At most 50 resources that block the request.
          title: Blocking Resources
        client_id:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          description: The account of the operation.
          title: Client Id
        operation:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Name of the operation that the credentials lack.
          title: Operation
        project_id:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          description: The project of the operation.
          title: Project Id
        quotas:
          anyOf:
          - items:
              $ref: '#/components/schemas/ProblemQuota'
            type: array
          - type: 'null'
          default: null
          description: The quotas that the request exceeds.
          title: Quotas
        reason:
          anyOf:
          - $ref: '#/components/schemas/NotAvailableReason'
          - type: 'null'
          default: null
          description: Why the resource is not available.
        region_id:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          description: The region of the error.
          title: Region Id
        resource_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: ID or name of the resource.
          title: Resource Id
        resource_status:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Current status of the resource.
          title: Resource Status
        resource_type:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Type of the resource, as the permissions name it, such as `instances`.
          title: Resource Type
        retry_after:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          description: Seconds to wait before the next request. `null` when the server cannot tell.
          title: Retry After
      title: ProblemContext
      type: object
    ProblemError:
      additionalProperties: false
      description: One invalid input.
      properties:
        code:
          description: 'What is wrong, as a code from a fixed list, such as `missing`, `int_parsing` or `less_than_equal`, or one of the shared codes: `not_unique`, `not_found`, `mutually_exclusive`, `missing_one_of`, `incompatible_value`, `invalid_format`, `duplicate_item`, `invalid_status`. Codes are only added, never renamed or removed. Treat an unknown code like `value_error`.'
          type: string
        ctx:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          description: 'Values of the broken constraint, such as `{"le": 4096}`. Absent when the check has no values.'
          title: Ctx
        detail:
          description: What is wrong with the input.
          title: Detail
          type: string
        loc:
          description: 'Path to the input. Starts with `body`, `query`, `path` or `header`. A query filter is the parameter, then the operator: `name[contains]` is `["query", "name", "contains"]`.'
          items:
            anyOf:
            - type: string
            - type: integer
          title: Loc
          type: array
      required:
      - loc
      - code
      - detail
      title: ProblemError
      type: object
    ProblemQuota:
      additionalProperties: false
      description: One quota that the request exceeds.
      properties:
        available:
          anyOf:
          - type: integer
          - type: number
          description: '`limit` minus `usage`.'
          title: Available
        limit:
          anyOf:
          - type: integer
          - type: number
          description: The limit of the quota.
          title: Limit
        name:
          description: Quota name, such as `vm_count`.
          title: Name
          type: string
        overflow:
          anyOf:
          - type: integer
          - type: number
          description: 'The amount above the limit: `resulting_usage` minus `limit`.'
          title: Overflow
        region_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: Region of a regional quota. `null` for a global quota, or when unknown.
          title: Region Id
        requested:
          anyOf:
          - type: integer
          - type: number
          description: The amount that the request adds.
          title: Requested
        resulting_usage:
          anyOf:
          - type: integer
          - type: number
          description: 'The usage after the request: `usage` plus `requested`.'
          title: Resulting Usage
        scope:
          anyOf:
          - $ref: '#/components/schemas/QuotaScope'
          - type: 'null'
          description: '`regional` for a quota of one region, `global` for a quota of the account. `null` when the server cannot tell.'
        unit:
          anyOf:
          - type: string
          - type: 'null'
          description: Unit of the numbers, such as `MiB`, `GiB` or `bytes`. `null` for a quota that counts items.
          title: Unit
        usage:
          anyOf:
          - type: integer
          - type: number
          description: The usage before the request.
          title: Usage
      required:
      - name
      - scope
      - region_id
      - limit
      - usage
      - available
      - requested
      - resulting_usage
      - overflow
      - unit
      title: ProblemQuota
      type: object
    ProblemType:
      enum:
      - internal-server-error
      - method-not-allowed
      - not-available
      - not-found
      - permission-denied
      - quota-exceeded
      - rate-limited
      - resource-busy
      - resource-in-use
      - service-unavailable
      - unauthorized
      - validation-error
      title: ProblemType
      type: string
    ProblemWithLegacyKeys:
      additionalProperties: false
      description: |-
        The error body of an endpoint that was released before the problem body. The old keys stay
        next to the problem fields until the endpoint is removed.
      properties:
        context:
          anyOf:
          - $ref: '#/components/schemas/ProblemContext'
          - type: 'null'
          default: null
          description: Data for the `type`. Absent on a type without context keys, and on a `not-found` for an unknown URL.
        detail:
          description: The facts of this occurrence.
          title: Detail
          type: string
        errors:
          anyOf:
          - items:
              $ref: '#/components/schemas/ProblemError'
            type: array
          - type: 'null'
          default: null
          description: One item for each invalid input. Only on `validation-error`, and absent when no single input is wrong.
          title: Errors
        exception_class:
          deprecated: true
          description: The old name of the error. Use `type`.
          title: Exception Class
          type: string
        hint:
          description: What to do next.
          title: Hint
          type: string
        info:
          default: null
          deprecated: true
          description: Old data about the error. Use `context`.
          title: Info
        invalid_fields:
          default: null
          deprecated: true
          description: The old list of the invalid inputs. Use `errors`.
          title: Invalid Fields
        message:
          deprecated: true
          description: The old text of the error. Use `detail`.
          title: Message
          type: string
        request_id:
          description: ID of the request. The response also sends it in the `X-Request-Id` header. Quote it to support.
          title: Request Id
          type: string
        status:
          description: Copy of the HTTP status code.
          title: Status
          type: integer
        title:
          description: Fixed sentence for the `type`.
          title: Title
          type: string
        trace_id:
          anyOf:
          - type: string
          - type: 'null'
          description: W3C trace ID from the `traceparent` of the request. Null when the request has no valid `traceparent`.
          title: Trace Id
        type:
          $ref: '#/components/schemas/ProblemType'
          description: Stable error code in kebab-case, such as `not-found`. Clients branch on it. It is not `errors[].code`, which names what is wrong with one input in `snake_case`, such as `not_found`.
      required:
      - type
      - title
      - status
      - detail
      - hint
      - request_id
      - trace_id
      - exception_class
      - message
      title: ProblemWithLegacyKeys
      type: object
    QuotaScope:
      enum:
      - global
      - regional
      title: QuotaScope
      type: string
    RegionalQuotasLimitsSerializer:
      additionalProperties: false
      properties:
        baremetal_basic_count_limit:
          description: Basic bare metal servers count limit
          example: 0
          examples:
          - 0
          title: Baremetal Basic Count Limit
          type: integer
        baremetal_gpu_a100_count_limit:
          description: Bare metal A100 GPU server count limit
          example: 0
          examples:
          - 0
          title: Baremetal Gpu A100 Count Limit
          type: integer
